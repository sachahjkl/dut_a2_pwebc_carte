<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Toilettes de Paris</title>
    <meta
      name="google-signin-client_id"
      content="325279709540-1e92k5508cu41jkseckt31e87do8ugpn.apps.googleusercontent.com.apps.googleusercontent.com"
    />
    <link rel="stylesheet" type="text/css" href="./css/style.css" />
    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
      integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.4.0/dist/leaflet.css"
      integrity="sha512-puBpdR0798OZvTTbP4A8Ix/l+A4dHDD0DGqYW6RQ+9jxkRFclaxxQb/SJAWZfWAkuyeQUytO7+7N4QKrDh+drA=="
      crossorigin=""
    />
    <link
      rel="icon"
      href="https://cdn4.iconfinder.com/data/icons/aiga-symbol-signs/612/aiga_toilets_bg-512.png"
    />
    <script
      defer
      src="https://use.fontawesome.com/releases/v5.7.2/js/all.js"
      integrity="sha384-0pzryjIRos8mFBWMzSSZApWtPl/5++eIfzYmTgBBmXYdhvxPc+XcFEk+zJwDgWbP"
      crossorigin="anonymous"
    ></script>
    <script src="https://code.jquery.com/jquery-3.3.1.min.js"></script>
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js"></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.3/umd/popper.min.js"
      integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/js/bootstrap.min.js"
      integrity="sha384-ChfqqxuZUCnJSK3+MXmPNIyE6ZbWh2IMqE241rYiqJxyMiZ6OW/JmZQ5stwEULTy"
      crossorigin="anonymous"
    ></script>
  </head>

  <body>
    <header>
      <div id="hero">
        <i class="fas fa-toilet-paper"></i>
        <a class="text-light" href="./index.html">Toilettes de Paris</a>
      </div>
      <nav class="navbar nav-pills navbar-expand-lg navbar-light bg-light shadow-sm">
        <button
          class="navbar-toggler"
          type="button"
          data-toggle="collapse"
          data-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse text-light" id="navbarSupportedContent">
          <ul class="navbar-nav mr-auto">
            <li class="nav-item mr-3">
              <div class="btn-group" role="group">
                <button type="button" id="addGPS" class="btn btn-primary shadow-sm">
                  <i class="fas fa-compass"></i> Marquer
                </button>
                <button type="button" id="removeGPS" class="btn btn-danger shadow-sm">
                  Retirer
                </button>
                <button type="button" class="btn btn-secondary shadow-sm">votre position</button>
              </div>
            </li>
            <li class="nav-item">
              <button type="button" id="ResZoom" class="btn btn-primary shadow-sm">
                <i class="fas fa-search-minus"></i> Dézoomer
              </button>
            </li>
          </ul>
          <form class="form-inline">
            <button class="btn btn-danger nav-item nav-link mx-2 shadow-sm" type="submit">
              <i class="fa fa-lock" aria-hidden="true"></i> Logout
            </button>
          </form>
        </div>
      </nav>
    </header>
    <div class="container-fluid mt-5">
      <div class="row mb-4">
        <div id="optionsDiv" class="col-lg-2 card shadow-sm mx-auto">
          <div class="card-body px-0">
            <div class="card card-body sticky-top shadow-sm">
              <button id="fetchToilets" type="button" class="btn btn-success shadow-sm">
                Rechercher
              </button>
              <div class="mt-3">
                <input type="checkbox" id="switchOptions" />
                <label for="switchOptions">Activer les options</label>
              </div>
            </div>
            <hr />
            <h5 class="card-title">Critères de recherche</h5>
            <div id="options">
              <div id="rows-group" class="form-group card card-body">
                <input type="checkbox" id="check-rows" />
                <label for="rows">Nombre maximal de résultats :</label>
                <input type="number" class="form-control" id="rows" placeholder="10, 35, 150..." />
              </div>
              <div id="dist-group" class="form-group card card-body">
                <input type="checkbox" id="check-dist" />
                <label for="dist">Distance d'affichage depuis le centre/votre position :</label>
                <input
                  id="dist"
                  type="range"
                  value="10000"
                  max="10000"
                  min="500"
                  step="100"
                /><br />
                <label for="dist" id="dist-value"></label>
              </div>
              <div id="arrond-group" class="form-group card card-body">
                <input type="checkbox" id="check-arrond" />
                <label for="arrond">Arrondissement :</label>
                <select name="arrond" id="arrond"></select>
                <label for="arrond" id="dist-value"></label>
              </div>
              <div id="arrond-group" class="form-group card card-body">
                <label for="always">Ouvert 24h / 24:</label>
                <input type="checkbox" id="always" />
              </div>
            </div>
          </div>
        </div>

        <div id="mapid" class="shadow-sm mx-auto rounded col-lg-7"></div>

        <div id="resultBox" class="col-lg-2 card shadow-sm mx-auto">
          <div class="card-body px-0">
            <div class="card card-body sticky-top shadow-sm">
              <h5>Toilettes trouvées : <span id="nbResults"></span></h5>
            </div>
            <hr />
            <div id="results" class="row"></div>
          </div>
        </div>
      </div>
    </div>
  </body>
  <script
    src="https://unpkg.com/leaflet@1.4.0/dist/leaflet.js"
    integrity="sha512-QVftwZFqvtRNi0ZyCtsznlKSWOStnDORoefr1enyq5mVL4tmKB3S/EnC3rRJcxCPavG10IcrVGSmPh6Qw5lwrg=="
    crossorigin=""
  ></script>
  <script src="./scripts/script.js"></script>
</html>
